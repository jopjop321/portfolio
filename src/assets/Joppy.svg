<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="luxuryGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A6F37" />
      <stop offset="30%" stop-color="#C5A059" />
      <stop offset="50%" stop-color="#F4D068" />
      <stop offset="75%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#A38142" />
    </linearGradient>

    <linearGradient id="radiantWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E4E4E7" />
      <stop offset="100%" stop-color="#A1A1AA" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="#030303" />

  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#luxuryGold)" stroke-width="6" opacity="0.8" />

  <g filter="url(#goldGlow)">
    <path 
      d="M 170 290 L 325 135 L 355 135 L 355 165 L 200 320 Z" 
      fill="url(#luxuryGold)" 
    />

    <path 
      d="M 325 135 
         L 355 135 
         L 355 330 
         A 95 95 0 0 1 160 330 
         L 160 300 
         A 65 65 0 0 0 325 330 
         Z" 
      fill="url(#radiantWhite)" 
    />

    <path 
      d="M 245 245 L 355 135 L 355 150 L 260 245 Z" 
      fill="#FFFFFF" 
      opacity="0.3" 
    />
  </g>
</svg>
